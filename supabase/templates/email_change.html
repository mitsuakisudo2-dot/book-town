<h2>BookTown のメールアドレスの変更</h2>
<p>
  ログインに使うメールアドレスを、{{ .Email }} から {{ .NewEmail }}
  に変えるためのコードです。BookTown
  の画面で、このメールが届いたアドレスの欄に、この6桁の数字を入れてください。
</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px">
  {{ .Token }}
</p>
<p>
  コードは、今のアドレスと新しいアドレスの両方に1通ずつ送っています。どちらも10分で使えなくなります。
</p>
<p>
  心当たりがないときは、このメールを消してください。コードを誰にも伝えなければ、メールアドレスは変わりません。
</p>
