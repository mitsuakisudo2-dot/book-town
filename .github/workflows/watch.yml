name: Watch production

# Watches https://booktown.page and the Supabase project (scripts/watch.mjs,
# settings in scripts/watch.json). Every 15 minutes: the pages open and
# Supabase is healthy. Every morning at 06:17 Japan time: the daily backup is
# recent, how much of the plan is used (in the run's summary), how many errors
# readers' screens sent in the last day, and a visitor's
# walk through the production site (tests/production-journey.mjs). A failure
# opens an issue that mentions the owner, so GitHub emails them; the next
# passing run closes it. The steps are in watch-run.yml.
#   watch  the schedule and a run by hand, on main: the environment watch's
#          SUPABASE_WATCH_TOKEN (Backups and Database, read only; its own
#          name, so a missing one is never filled by an older, wider key)
#          and SUPABASE_PROJECT_ID. Without the token the run fails.
#   try    a pull request that changes the watch: the same steps once, with no
#          key, no issues and a GITHUB_TOKEN that may only read.

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      check:
        description: site checks the pages and Supabase; daily also checks the backups and usage and walks through the site
        type: choice
        options: [site, daily]
        default: daily
  pull_request:
    paths:
      - scripts/watch.mjs
      - scripts/watch.json
      - tests/production-journey.mjs
      - .github/workflows/watch.yml
      - .github/workflows/watch-run.yml

permissions:
  contents: read

concurrency:
  group: watch-${{ github.event_name == 'pull_request' && github.head_ref || github.event.schedule || inputs.check }}
  cancel-in-progress: false

jobs:
  watch:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/watch-run.yml
    with:
      daily: ${{ github.event.schedule == '17 21 * * *' || inputs.check == 'daily' }}
      environment: watch
    secrets: inherit

  try:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/watch-run.yml
    with:
      daily: true
      environment: ""
