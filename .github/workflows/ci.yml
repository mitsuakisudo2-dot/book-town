name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A migration the pull request adds needs a version of its own, after
      # every one on the base branch: production applies them in that order
      # and refuses an older one. The base branch's own migrations stay as
      # they are: production never runs a changed one again
      # (scripts/check-migration-versions.sh).
      - name: New migrations come after the base branch's, which stay as they are
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          bash scripts/check-migration-versions.sh FETCH_HEAD
      # Uses the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:domain
      - run: pnpm test:library
      - run: pnpm test:walk-domain
      - run: pnpm test:covers
      - run: pnpm test:search
      - run: pnpm test:posters
      - run: pnpm test:customization-domain
      - run: pnpm test:shop-layout
      - run: pnpm test:db
      - run: pnpm test:account
      - run: pnpm test:site-notes
      - run: pnpm test:town-sync
      - run: pnpm test:settings
      - run: pnpm build

  # Signs in against a stand-in for Supabase in a real browser.
  login-journey:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Serve the built site
        run: python3 -m http.server 5173 --bind 127.0.0.1 --directory out &
      - run: pnpm test:login
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/login-qa

  # How much JS each page reads, and how fast Home opens on a slow phone
  # (390px, Slow 4G, CPU four times slower), for a reader signed in against a
  # stand-in for Supabase: the build as production's, served with brotli
  # (scripts/perf). Each fails over its line: tests/page-js-baseline.json for
  # the JS, SPEED_LIMITS for the median of five openings (AUD-044, AUD-048).
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:page-js
      - name: Serve the built site as Vercel does
        run: node scripts/perf/serve.mjs out 5181 &
      # A runner here opens Home in about 5.8s to the first 便り and 6.6s to the
      # first tap (2026-10-19, five openings within 0.6s); the lines leave a
      # tenth for the runner. Lower them as Home gets faster (target 2.5s).
      - name: Home's first 便り and first moment to take a tap
        run: pnpm test:speed 5
        env:
          SPEED_LIMITS: first=6500,interactive=7300
      # The same in a town whose shops have shelved books (TOWN=grown): the
      # books outside the catalog are read after the town, and a reader with
      # a shop of their own reads its rows before them, so Home waits for
      # three answers in a row (2026-10-23).
      - name: Home in a town with shelved books, for someone new
        run: pnpm test:speed 5
        env:
          TOWN: grown
          VISITOR: 1
      - name: Home in a town with shelved books, for a reader with a shop
        run: pnpm test:speed 5
        env:
          TOWN: grown

  # The demo build (no Supabase) in a real browser: the walk, the store
  # editor, registering a book, reacting to a shop's books (feedback) and
  # making a poster, without an account. The pages that keep what a reader
  # writes and arranges are checked in demo-pages beside it, which takes
  # longer, so these two more do not lengthen the run.
  demo-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Serve the built site
        id: serve
        run: python3 -m http.server 5173 --bind 127.0.0.1 --directory out &
      - run: pnpm test:walk
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/walk
      # Runs even after the walk failed, so one run shows both screens.
      - run: pnpm test:customization
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/customization
      - run: pnpm test:library-journey
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/library
      - run: pnpm test:feedback
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/feedback
      - run: pnpm test:poster-journey
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/poster
      # Screenshots of the demo town only; nothing secret is in them.
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-journeys-qa
          path: ${{ runner.temp }}/qa
          retention-days: 7

  # The demo build again, for the pages that keep what a reader writes and
  # arranges: shelves, the profile and the shop sign (browser), posts,
  # records and the reading memo (social), the Home tab's address (street),
  # opening a shop (app) and the 便り's card and page on a phone (home). A job
  # of its own, so it runs beside the one above rather than after it (about
  # six minutes of journeys).
  demo-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Serve the built site
        id: serve
        run: python3 -m http.server 5173 --bind 127.0.0.1 --directory out &
      - run: pnpm test:browser
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/browser
      # Each runs even after one before it failed, so one run shows them all.
      - run: pnpm test:social
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/social
      - run: pnpm test:street
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/street
      - run: pnpm test:app
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/app
      - run: pnpm test:home
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/home
      # Screenshots of the demo town only; nothing secret is in them.
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-pages-qa
          path: ${{ runner.temp }}/qa
          retention-days: 7

  # Signs in and saves a town against a real local Supabase: auth, the code
  # email, the REST API and row level security, with the migrations and
  # supabase/config.toml applied. Passkeys are made in Chromium, with its
  # stand-in authenticator.
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,storage-api,postgres-meta
      - name: Sign in and use the town against it
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          pnpm test:supabase
      - name: The app's database types match the migrations
        run: |
          types=src/lib/supabase/database.generated.ts
          { head -3 "$types"; supabase gen types typescript --local; } |
            pnpm exec prettier --stdin-filepath "$types" | diff - "$types"
