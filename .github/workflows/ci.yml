name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Uses the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:domain
      - run: pnpm test:walk-domain
      - run: pnpm test:covers
      - run: pnpm test:posters
      - run: pnpm test:customization-domain
      - run: pnpm test:db
      - run: pnpm test:account
      - run: pnpm test:town-sync
      - run: pnpm test:settings
      - run: pnpm build

  # Signs in against a stand-in for Supabase in a real browser.
  login-journey:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Serve the built site
        run: python3 -m http.server 5173 --bind 127.0.0.1 --directory out &
      - run: pnpm test:login
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/login-qa

  # The demo build in a real browser, as a reader without an account uses it.
  # No Supabase settings, so the town lives in the browser's storage. One
  # build and one server for every journey.
  demo-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Serve the built site
        id: serve
        run: python3 -m http.server 5173 --bind 127.0.0.1 --directory out &
      # Each journey runs even after an earlier one failed, so one run shows
      # every screen that broke.
      - run: pnpm test:walk
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/walk
      - run: pnpm test:customization
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/customization
      - run: pnpm test:app
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/app
      - run: pnpm test:browser
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/browser
      - run: pnpm test:street
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/street
      - run: pnpm test:social
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/social
      - run: pnpm test:feedback
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/feedback
      - run: pnpm test:poster-journey
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          BOOK_TOWN_QA_OUTPUT: ${{ runner.temp }}/qa/poster
      # Screenshots of the demo town only; nothing secret is in them.
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-journeys-qa
          path: ${{ runner.temp }}/qa
          retention-days: 7

  # Signs in and saves a town against a real local Supabase: auth, the code
  # email, the REST API and row level security, with the migrations and
  # supabase/config.toml applied.
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,storage-api,postgres-meta
      - name: Sign in and use the town against it
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          pnpm test:supabase
      - name: The app's database types match the migrations
        run: |
          types=src/lib/supabase/database.generated.ts
          { head -3 "$types"; supabase gen types typescript --local; } |
            pnpm exec prettier --stdin-filepath "$types" | diff - "$types"
