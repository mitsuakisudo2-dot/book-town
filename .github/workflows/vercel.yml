name: Vercel

# Looks after the Vercel project with the VERCEL_TOKEN repository secret:
# recent deployments of a branch with the end of a failed build's log, or a new
# build of a branch when Vercel stopped before building. scripts/vercel.mjs
# does the work. Pull requests that change it only try the script, with no key
# at all (the branch's own code runs there), so Vercel is not asked. A push to
# main makes sure production gets built, since Vercel sometimes misses one.
# domains shows the project's addresses and domains-apply adds SITE_DOMAIN (www
# sent on to it); mail and mail-apply set up sending the
# login email from MAIL_DOMAIN through Resend (RESEND_ADMIN_KEY, a Full access
# key, adds the domain; the sending key in RESEND_API_KEY cannot). rollback
# points the site back at the production build before the current one (it
# refuses when the migrations differ, unless allow_migrations is ticked), and
# promote-latest publishes the newest build again (docs/09「本番を直前の版に戻す」).

on:
  workflow_dispatch:
    inputs:
      action:
        description: status lists recent deployments; deploy builds the branch again; domains shows the addresses, domains-apply adds SITE_DOMAIN; mail shows what sending from MAIL_DOMAIN needs, mail-apply does it; rollback goes back one production build, promote-latest undoes it
        type: choice
        options: [status, deploy, domains, domains-apply, mail, mail-apply, rollback, promote-latest]
        default: status
      branch:
        description: Branch to look at or build (main goes to production)
        type: string
        default: main
      allow_migrations:
        description: rollback even though the migrations changed since that build (only when the database still works with it)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/vercel.mjs
      - .github/workflows/vercel.yml

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # rollback compares the migrations of two commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask Vercel
        run: node scripts/vercel.mjs "$ACTION" "$BRANCH"
        env:
          ACTION: ${{ inputs.action || (github.event_name == 'push' && 'ensure') || 'status' }}
          BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations && 'yes' || 'no' }}
          VERCEL_TOKEN: ${{ github.event_name != 'pull_request' && secrets.VERCEL_TOKEN || '' }}
          VERCEL_TEAM: booktown1
          VERCEL_PROJECT: book-town-851k
          SITE_DOMAIN: booktown.page
          MAIL_DOMAIN: booktown.page
          RESEND_API_KEY: ${{ github.event_name != 'pull_request' && secrets.RESEND_API_KEY || '' }}
          RESEND_ADMIN_KEY: ${{ github.event_name != 'pull_request' && secrets.RESEND_ADMIN_KEY || '' }}
