name: Vercel

# Looks after the Vercel project with the VERCEL_TOKEN repository secret:
# recent deployments of a branch with the end of a failed build's log, or a new
# build of a branch when Vercel stopped before building. scripts/vercel.mjs
# does the work. Pull requests that change it run a status check. A push to
# main makes sure production gets built, since Vercel sometimes misses one.
# domains shows the project's addresses and domains-apply adds SITE_DOMAIN (www
# sent on to it); mail and mail-apply set up sending the
# login email from MAIL_DOMAIN through Resend (RESEND_ADMIN_KEY, a Full access
# key, adds the domain; the sending key in RESEND_API_KEY cannot).

on:
  workflow_dispatch:
    inputs:
      action:
        description: status lists recent deployments; deploy builds the branch again; domains shows the addresses, domains-apply adds SITE_DOMAIN; mail shows what sending from MAIL_DOMAIN needs, mail-apply does it
        type: choice
        options: [status, deploy, domains, domains-apply, mail, mail-apply]
        default: status
      branch:
        description: Branch to look at or build (main goes to production)
        type: string
        default: main
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/vercel.mjs
      - .github/workflows/vercel.yml

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask Vercel
        run: node scripts/vercel.mjs "$ACTION" "$BRANCH"
        env:
          ACTION: ${{ inputs.action || (github.event_name == 'push' && 'ensure') || 'status' }}
          BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM: booktown1
          VERCEL_PROJECT: book-town-851k
          SITE_DOMAIN: booktown.page
          MAIL_DOMAIN: booktown.page
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_ADMIN_KEY: ${{ secrets.RESEND_ADMIN_KEY }}
