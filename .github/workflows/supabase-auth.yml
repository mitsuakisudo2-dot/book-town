name: Supabase auth settings

# Keeps the hosted project's sign-in settings in line with
# supabase/hosted-auth.json; scripts/supabase-auth.mjs says what is set.
#   A pull request gets no key at all; the files' shape is pnpm test:settings's.
#   On main, look reads the project with the environment production-read's
#   SUPABASE_READ_TOKEN (Auth Config, read only) and shows what would change;
#   if it cannot read, the run stops there. apply then waits for the owner's
#   approval in GitHub and changes it with production-auth's
#   SUPABASE_AUTH_TOKEN (Auth Config, Read-write). Each environment's key has
#   its own name, so a missing one is never filled by an older, wider key.
#   RESEND_API_KEY turns on the email settings and TURNSTILE_SECRET_KEY is
#   what captcha.on needs (both in production-read and production-auth;
#   docs/開発と運用/権限と鍵.md).

on:
  push:
    branches: [main]
    paths:
      - supabase/hosted-auth.json
      - supabase/templates/**
      - scripts/supabase-auth.mjs
      - .github/workflows/supabase-auth.yml
  pull_request:
    paths:
      - supabase/hosted-auth.json
      - supabase/templates/**
      - scripts/supabase-auth.mjs
      - .github/workflows/supabase-auth.yml
  workflow_dispatch:
    inputs:
      mode:
        description: check shows what would change; apply changes it
        type: choice
        options: [check, apply]
        default: check

permissions:
  contents: read

concurrency:
  group: supabase-auth-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && 'production-read' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What would change in the sign-in settings
        run: node scripts/supabase-auth.mjs "$MODE"
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'check' || 'look' }}
          SUPABASE_ACCESS_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_READ_TOKEN || '' }}
          SUPABASE_PROJECT_ID: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_PROJECT_ID || '' }}
          RESEND_API_KEY: ${{ github.event_name != 'pull_request' && secrets.RESEND_API_KEY || '' }}
          TURNSTILE_SECRET_KEY: ${{ github.event_name != 'pull_request' && secrets.TURNSTILE_SECRET_KEY || '' }}

  apply:
    needs: look
    if: github.event_name == 'push' || inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: production-auth
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring the sign-in settings in line
        run: node scripts/supabase-auth.mjs apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
