name: Supabase auth settings

# Keeps the hosted project's sign-in settings in line with
# supabase/hosted-auth.json; scripts/supabase-auth.mjs says what is set. A pull
# request that touches them is checked without any key (the files' shape is
# pnpm test:settings's). On main, look shows what would change with the
# environment production-read's token (Auth Config, read only), and apply
# changes it with production-auth's (Auth Config, Read-write), which waits for
# the owner's approval in GitHub. Both need SUPABASE_ACCESS_TOKEN and
# SUPABASE_PROJECT_ID; RESEND_API_KEY turns on the email settings, and
# TURNSTILE_SECRET_KEY is what captcha.on needs. Without them the run is
# skipped with a warning.

on:
  push:
    branches: [main]
    paths:
      - supabase/hosted-auth.json
      - supabase/templates/**
      - scripts/supabase-auth.mjs
      - .github/workflows/supabase-auth.yml
  pull_request:
    paths:
      - supabase/hosted-auth.json
      - supabase/templates/**
      - scripts/supabase-auth.mjs
      - .github/workflows/supabase-auth.yml
  workflow_dispatch:
    inputs:
      mode:
        description: check shows what would change; apply changes it
        type: choice
        options: [check, apply]
        default: check

permissions:
  contents: read

concurrency:
  group: supabase-auth-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && 'production-read' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What would change in the sign-in settings
        run: node scripts/supabase-auth.mjs check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

  apply:
    needs: look
    if: github.event_name == 'push' || inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: production-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring the sign-in settings in line
        run: node scripts/supabase-auth.mjs apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
