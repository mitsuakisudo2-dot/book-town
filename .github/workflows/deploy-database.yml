name: Deploy database

# Applies new files in supabase/migrations to the Supabase project once they reach
# main. Needs three repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
# and SUPABASE_PROJECT_ID. Until they are set, the run is skipped with a warning.
# The access token is kept for later Supabase deploys; migrations only need the
# database password.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check the Supabase secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Supabase secrets are not set yet, so no migration was applied."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.120.0
      # GitHub's runners have no IPv6, and the database's direct address is
      # IPv6 only, so the migrations go through Supabase's IPv4 session pooler
      # in the project's region (Tokyo). Its host name starts with aws-0 or
      # aws-1 depending on when the project was made; the wrong one refuses
      # the login before anything is applied.
      - name: Apply new migrations
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_REGION: ap-northeast-1
        run: |
          password=$(jq -rn --arg value "$SUPABASE_DB_PASSWORD" '$value | @uri')
          echo "::add-mask::$password"
          for cluster in aws-0 aws-1; do
            url="postgresql://postgres.$SUPABASE_PROJECT_ID:$password@$cluster-$SUPABASE_REGION.pooler.supabase.com:5432/postgres"
            if supabase db push --db-url "$url" --yes; then
              exit 0
            fi
          done
          exit 1
