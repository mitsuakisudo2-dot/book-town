name: Catalog role password

# Lets the role catalog_import log in, once, so the library catalog's import
# (.github/workflows/catalog-import.yml) stops using the database owner's
# password (docs/09「本番の設定」). Run by hand, after the owner approves in
# GitHub (the environment production-db). The environment holds, for this
# run only, CATALOG_DB_PASSWORD: the same value as the environment catalog's,
# at least 32 letters and digits. It is sent as its SCRAM-SHA-256 verifier
# (scripts/catalog-role-password.mjs), never as itself, and nothing is
# printed but whether the role can log in.
#
# Running it again gives the role the password the environment holds then.
# Rollback: alter role catalog_import nologin password null;

on:
  workflow_dispatch:

permissions:
  contents: read

# Never at the same time as a migration.
concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-db
    env:
      PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The session pooler, as Deploy database finds it.
      - name: Give catalog_import its password
        run: |
          owner=$(jq -rn --arg value "$PRODUCTION_DB_PASSWORD" '$value | @uri')
          echo "::add-mask::$owner"
          echo "::add-mask::$CATALOG_DB_PASSWORD"
          node scripts/catalog-role-password.mjs > statement.sql
          for cluster in aws-0 aws-1; do
            url="postgresql://postgres.$SUPABASE_PROJECT_ID:$owner@$cluster-$SUPABASE_REGION.pooler.supabase.com:5432/postgres"
            if psql "$url" -X -q -c "select 1" > /dev/null 2> "refused-$cluster.txt"; then
              psql "$url" -X -q -v ON_ERROR_STOP=1 -f statement.sql
              rm statement.sql
              echo "CLUSTER=$cluster" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          rm statement.sql
          # The project's own cluster says why; the other only that it has no
          # such project.
          for cluster in aws-0 aws-1; do
            echo "--- $cluster"
            cat "refused-$cluster.txt"
          done
          echo "::error::The pooler refused the owner's login, so nothing changed."
          exit 1
      - name: catalog_import logs in, and reaches catalog_api but not private
        run: |
          url="postgresql://catalog_import.$SUPABASE_PROJECT_ID:$CATALOG_DB_PASSWORD@$CLUSTER-$SUPABASE_REGION.pooler.supabase.com:5432/postgres"
          seen=$(psql "$url" -X -q -t -A -c "select current_user, has_schema_privilege('catalog_api', 'usage'), has_schema_privilege('private', 'usage')")
          echo "$seen"
          test "$seen" = "catalog_import|t|f"
